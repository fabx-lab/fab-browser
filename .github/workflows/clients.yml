name: Build and verify clients
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: windows-2022
            platform: win
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Build native client
        run: pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify downloaded package (macOS and Windows)
        if: runner.os != 'Linux'
        run: pnpm verify:client
      - name: Verify AppImage under desktop display
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm verify:client
      - name: Retain failure and success evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/client-*/
          if-no-files-found: ignore
      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
