<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'">
<title>FAB DeWEB Browser</title><link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="icon-definitions" aria-hidden="true"><defs>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m12 5-7 7 7 7M5 12h14"/></symbol>
<symbol id="i-forward" viewBox="0 0 24 24"><path d="m12 5 7 7-7 7M5 12h14"/></symbol>
<symbol id="i-reload" viewBox="0 0 24 24"><path d="M19 7a8 8 0 1 0 1 8M19 3v5h-5"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.8 6.4.9-4.6 4.5 1.1 6.3-5.7-3-5.7 3 1.1-6.3-4.6-4.5 6.4-.9Z"/></symbol>
<symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 4v16"/></symbol>
<symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7m0-7L10 14M10 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></symbol>
</defs></svg>
<header class="tab-strip">
<div class="brand" aria-label="FAB DeWEB"><span class="brand-mark">F</span><span>FAB <b>DeWEB</b></span></div>
<div id="tabs" class="tab-list" role="tablist" aria-label="应用标签页"></div>
<button id="new-tab" class="icon-button new-tab" aria-label="新建标签页" title="新建标签页（Cmd/Ctrl+T）">＋</button>
<span class="environment">测试版</span>
<button id="developer" class="text-button" title="在默认浏览器打开开发者中心">开发者中心<svg class="icon"><use href="#i-external"/></svg></button>
</header>
<form id="address" class="toolbar">
<div class="navigation">
<button type="button" id="back" class="icon-button" aria-label="后退" title="后退"><svg class="icon"><use href="#i-back"/></svg></button>
<button type="button" id="forward" class="icon-button" aria-label="前进" title="前进"><svg class="icon"><use href="#i-forward"/></svg></button>
<button type="button" id="reload" class="icon-button" aria-label="刷新最新版本" title="重新读取链上版本"><svg class="icon"><use href="#i-reload"/></svg></button>
<button type="button" id="stop" class="icon-button" aria-label="停止加载" title="停止加载" hidden>×</button>
</div>
<div class="address-field"><svg class="icon address-icon" aria-hidden="true"><use href="#i-globe"/></svg><input id="input" aria-label="应用地址" placeholder="搜索已配置应用或输入容器地址" spellcheck="false" autocomplete="off"><button type="button" id="bookmark" class="icon-button" aria-label="添加书签" title="添加书签" aria-pressed="false" disabled><svg class="icon"><use href="#i-star"/></svg></button></div>
<button class="open-button" title="打开应用">打开</button>
<button type="button" id="find-button" class="icon-button" aria-label="页内查找" title="页内查找（Cmd/Ctrl+F）"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg></button>
<button type="button" id="zoom-reset" class="text-button" aria-label="恢复实际大小" hidden>100%</button>
<button type="button" id="panel-toggle" class="icon-button" aria-label="打开应用侧栏" aria-controls="sidebar" aria-expanded="false" title="应用、书签和网站信息"><svg class="icon"><use href="#i-panel"/></svg></button>
</form>
<form id="find-bar" class="find-bar" hidden aria-label="页内查找"><input id="find-input" aria-label="查找内容" placeholder="在页面中查找" maxlength="500"><span id="find-result" role="status">0 / 0</span><button type="button" id="find-prev" aria-label="上一个匹配">↑</button><button type="button" id="find-next" aria-label="下一个匹配">↓</button><button type="button" id="find-close" aria-label="关闭查找">×</button></form>
<aside id="sidebar" hidden aria-label="应用侧栏">
<div class="sidebar-heading"><h1>应用空间</h1><button id="panel-close" class="icon-button" aria-label="关闭侧栏"><svg class="icon"><use href="#i-close"/></svg></button></div>
<h2>应用</h2><button id="demo" class="app-item"><span class="game-icon" aria-hidden="true">弈</span><span><strong>五子棋</strong><small>本地双人 · 人机对弈</small></span><span class="item-arrow" aria-hidden="true">›</span></button>
<h2>书签与最近访问</h2><button id="clear-history" class="text-button">清空访问历史</button><div id="library-list"></div>
<h2>当前网站</h2><div id="identity">打开应用后查看链上绑定信息。</div>
<dl id="metadata" hidden><dt>网络</dt><dd id="meta-chain"></dd><dt>发布版本</dt><dd id="meta-version"></dd><dt>IPFS CID</dt><dd id="meta-cid" class="mono"></dd><dt>电路容器</dt><dd id="meta-container" class="mono"></dd></dl>
<p class="verification-note">核对链上 CID 与版本，网站通过平台 HTTPS 网关读取。客户端尚未独立验证 IPFS DAG。</p>
</aside>
<main id="start-page"><div class="start-content"><span class="start-logo" aria-hidden="true">F</span><h1>打开应用，开始探索。</h1><p>你的 FAB 应用，一个简单的入口。</p><button id="start-demo" class="start-app"><span class="game-icon" aria-hidden="true">弈</span><span><strong>五子棋</strong><small>无需钱包，即刻对弈</small></span><span aria-hidden="true">↗</span></button><span class="start-note">文件存储于 IPFS · 发布权限随电路 NFT 转移</span></div></main>
<footer class="status-bar"><span id="status-dot" aria-hidden="true"></span><span id="status" role="status">选择应用，无需钱包即可访问。</span><span id="release-label">FAB 测试环境</span></footer>
<script type="module" src="app.js"></script>
</body></html>
